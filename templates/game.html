{% extends 'base.html' %}
{% block title %}Гравець{% endblock %}
{% block content %}
<div class="text-center">
    <div class="badge bg-info text-dark fs-6 mb-2">Кімната: <span id="roomCode">{{ room_code }}</span></div>
    <h1 class="h2 mb-3">Гравець: <span id="playerName" class="text-warning text-break">{{ player_name }}</span></h1>
    <div id="statusAlert" class="alert alert-secondary fs-5" role="alert">Очікування старту раунду...</div>
    
    <div class="row">
        <div class="col-12 col-md-8 col-lg-6 mx-auto">
            <button id="mainButton"
                class="btn btn-danger my-4 d-flex w-100 align-items-center justify-content-center"
                style="min-height: 240px; font-size: 2.2rem; font-weight: bold;
               border: none; 
               border-radius: 24px;
               background: linear-gradient(180deg, #ff5c5c 0%, #e02b2b 45%, #b71c1c 100%);
               color: #fff;
               text-shadow: 0 2px 3px rgba(0,0,0,0.45);
               box-shadow: 
                   0 10px 0 #6d0000,
                   0 14px 0 #4a0000, 
                   0 18px 24px rgba(0,0,0,0.55),
                   inset 0 3px 2px rgba(255,255,255,0.55),
                   inset 0 -6px 10px rgba(0,0,0,0.35); 
               transform: translateY(-6px);
               transition: none;
               cursor: pointer;"
                disabled>
                ТИСНИ!
            </button>
        </div>
    </div>
</div>
{% endblock %}
